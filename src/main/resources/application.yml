spring:
  application:
    name: modeus-schedule-bot
  main:
    web-application-type: none

telegram:
  bot:
    enabled: ${TELEGRAM_BOT_ENABLED:false}
    token: ${TELEGRAM_BOT_TOKEN:}
    username: ${TELEGRAM_BOT_USERNAME:}

telegrambots:
  enabled: ${telegram.bot.enabled}

modeus:
  base-url: https://urfu.modeus.org
  token: ${MODEUS_TOKEN:}
  person-id: ${MODEUS_PERSON_ID:}
  zone-id: Asia/Yekaterinburg
  connect-timeout: 5s
  read-timeout: 20s
  auth:
    mode: ${MODEUS_AUTH_MODE:MANUAL}
    username: ${MODEUS_USERNAME:}
    password: ${MODEUS_PASSWORD:}
    auth-url: https://urfu-auth.modeus.org
    sso-url: https://sso.urfu.ru
